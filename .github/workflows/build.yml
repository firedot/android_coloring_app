name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Validates the wrapper jar and caches Gradle dependencies and the build cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Debug + release assemble, lint and unit tests (including Robolectric) for all modules.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  bundle:
    name: Signed release bundle
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.COLOURFUN_KEYSTORE_BASE64 }}
      COLOURFUN_KEYSTORE_PASSWORD: ${{ secrets.COLOURFUN_KEYSTORE_PASSWORD }}
      COLOURFUN_KEY_ALIAS: ${{ secrets.COLOURFUN_KEY_ALIAS }}
      COLOURFUN_KEY_PASSWORD: ${{ secrets.COLOURFUN_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Skipped until the upload keystore secrets are configured in the repository.
      - name: Decode upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "COLOURFUN_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew :app:bundleRelease --stacktrace

      # The mapping file is uploaded to Play alongside the bundle to deobfuscate crash reports.
      - name: Upload bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
